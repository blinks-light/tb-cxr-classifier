<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TB Chest X-ray Classifier</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
          --pos:#f85149; --neg:#3fb950; --accent:#388bfd; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;
         display:flex; justify-content:center; padding:40px 20px; }
  main { width:100%; max-width:760px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  .drop { border:1.5px dashed var(--line); border-radius:8px; padding:32px 20px; text-align:center;
          cursor:pointer; transition:.15s; }
  .drop:hover, .drop.hot { border-color:var(--accent); background:#1c2128; }
  .drop b { color:var(--accent); }
  #preview { max-width:180px; max-height:180px; margin:16px auto 0; display:none; border-radius:6px; border:1px solid var(--line); }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 18px;
           font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #result { display:none; }
  .verdict { font-size:26px; font-weight:700; margin-bottom:6px; }
  .verdict.pos { color:var(--pos); } .verdict.neg { color:var(--neg); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 18px; margin:14px 0 0; font-size:14px; }
  dt { color:var(--dim); } dd { margin:0; font-variant-numeric:tabular-nums; }
  .bar { height:8px; background:#21262d; border-radius:4px; overflow:hidden; margin-top:10px; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#3fb950,#d29922,#f85149); }
  .err { color:var(--pos); font-size:14px; }
  code { background:#21262d; padding:1px 5px; border-radius:4px; font-size:12.5px; }
</style>
</head>
<body>
<main>
  <h1>Tuberculosis screening</h1>
  <div class="sub" id="meta">loading model info&hellip;</div>

  <div class="card">
    <div class="drop" id="drop">
      Drop a chest X-ray here, or <b>browse</b><br />
      <span class="sub" style="margin:0">PNG / JPEG &middot; max 8 MB</span>
      <img id="preview" alt="preview" />
    </div>
    <input type="file" id="file" accept="image/*" hidden />
    <div style="margin-top:16px; display:flex; gap:12px; align-items:center;">
      <button id="go" disabled>Predict</button>
      <span class="err" id="err"></span>
    </div>
  </div>

  <div class="card" id="result">
    <div class="verdict" id="verdict">&nbsp;</div>
    <div class="bar"><i id="bar"></i></div>
    <dl>
      <dt>P(tuberculosis)</dt><dd id="prob">&nbsp;</dd>
      <dt>decision threshold</dt><dd id="thr">&nbsp;</dd>
      <dt>latency</dt><dd id="lat">&nbsp;</dd>
    </dl>
  </div>
</main>
<script>
const drop = document.getElementById('drop'), fileInput = document.getElementById('file'),
      preview = document.getElementById('preview'), go = document.getElementById('go'),
      err = document.getElementById('err'), result = document.getElementById('result');
let selected = null;

fetch('/model-info').then(r => r.ok ? r.json() : Promise.reject())
  .then(m => {
    const acc = m.metrics && m.metrics.test_accuracy;
    document.getElementById('meta').textContent =
      `${m.model_name || 'model'} · preprocess ${m.preprocessing} · threshold ${m.threshold}` +
      (acc !== undefined ? ` · test accuracy ${(acc * 100).toFixed(1)}%` : '');
  }).catch(() => { document.getElementById('meta').textContent = 'model info unavailable'; });

function pick(file) {
  if (!file) return;
  selected = file; err.textContent = ''; result.style.display = 'none';
  preview.src = URL.createObjectURL(file); preview.style.display = 'block';
  go.disabled = false;
}
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => pick(e.target.files[0]));
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => pick(e.dataTransfer.files[0]));

go.addEventListener('click', async () => {
  if (!selected) return;
  go.disabled = true; err.textContent = 'running inference…';
  const body = new FormData(); body.append('file', selected);
  try {
    const res = await fetch('/predict', { method: 'POST', body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    const pos = data.label === 1;
    const v = document.getElementById('verdict');
    v.textContent = pos ? 'Tuberculosis suspected' : 'No tuberculosis detected';
    v.className = 'verdict ' + (pos ? 'pos' : 'neg');
    document.getElementById('bar').style.width = (data.probability * 100).toFixed(1) + '%';
    document.getElementById('prob').textContent = (data.probability * 100).toFixed(2) + '%';
    document.getElementById('thr').textContent = data.threshold;
    document.getElementById('lat').textContent = data.latency_ms.toFixed(1) + ' ms';
    result.style.display = 'block'; err.textContent = '';
  } catch (e) {
    err.textContent = e.message;
  } finally { go.disabled = false; }
});
</script>
</body>
</html>
